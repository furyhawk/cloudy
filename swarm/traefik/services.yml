tcp:
  routers:
    xiaozhi_ws:
      entryPoints:
        - xiaozhi-ws
      rule: HostSNI(`*`)
      tls: false
      service: xiaozhi_ws@file

  services:

    xiaozhi_ws:
      loadBalancer:
        servers:
          - address: 192.168.50.44:8033

http:
  middlewares:
    authentik-fwd:
      forwardAuth:
        address: http://tasks.authentik-proxy:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

  routers:
    traefik-public-https:
      entryPoints:
        - https
      rule: Host(`coco.furyhawk.lol`)
      middlewares:
        - admin-auth@swarm
      tls:
        certResolver: le
      service: coco_desktop@file

    pi_hole:
      entryPoints:
        - https
      rule: Host(`pihole.furyhawk.lol`)
      middlewares:
        - admin-auth@swarm
      tls:
        certResolver: le
      service: pi_hole@file

    dev_machine:
      entryPoints:
        - https
      rule: Host(`dev.furyhawk.lol`) || Host(`staging.furyhawk.lol`) || Host(`prod.furyhawk.lol`)
      tls:
        certResolver: le
      service: dev_machine@file

    service_machine:
      entryPoints:
        - https
      rule: Host(`service.furyhawk.lol`)
      tls:
        certResolver: le
      service: service_machine@file

    mail_machine:
      entryPoints:
        - https
      rule: Host(`email.furyhawk.lol`)
      middlewares:
        - admin-auth@swarm
      tls:
        certResolver: le
      service: mail_machine@file

    proxmox00:
      entryPoints:
        - https
      rule: Host(`proxmox00.furyhawk.lol`)
      middlewares:
        - admin-auth@swarm
      tls:
        certResolver: le
      service: proxmox00@file

    proxmox01:
      entryPoints:
        - https
      rule: Host(`proxmox01.furyhawk.lol`)
      middlewares:
        - admin-auth@swarm
      tls:
        certResolver: le
      service: proxmox01@file

    xiaozhi_web:
      entryPoints:
        - https
      rule: Host(`xiaozhi.furyhawk.lol`)
      tls:
        certResolver: le
      service: xiaozhi_web@file

    xiaozhi_ota:
      entryPoints:
        - https
      rule: Host(`ota.furyhawk.lol`)
      tls:
        certResolver: le
      service: xiaozhi_ota@file

    home_assistant:
      entryPoints:
        - https
      rule: Host(`ha.furyhawk.lol`)
      tls:
        certResolver: le
      service: home_assistant@file

    bus_app:
      entryPoints:
        - https
      rule: Host(`bus.furyhawk.lol`)
      priority: 10
      tls:
        certResolver: le
      service: bus_frontend@file

    bus_api:
      entryPoints:
        - https
      rule: Host(`bus.furyhawk.lol`) && PathPrefix(`/api`)
      priority: 100
      tls:
        certResolver: le
      service: bus_api@file

    rag_agent:
      entryPoints:
        - https
      rule: Host(`rag.furyhawk.lol`)
      middlewares:
        - authentik-fwd
      tls:
        certResolver: le
      service: rag_agent@file
  
    mysterium:
      entryPoints:
        - https
      rule: Host(`mysterium.furyhawk.lol`)
      middlewares:
        - authentik-fwd
      tls:
        certResolver: le
      service: mysterium@file

  services:

    coco_desktop:
      loadBalancer:
        servers:
          - url: http://192.168.50.178:5000

    proxmox00:
      loadBalancer:
        servers:
          - url: https://192.168.50.210:8006
        serversTransport: proxmox-transport

    proxmox01:
      loadBalancer:
        servers:
          - url: https://192.168.50.201:8006
        serversTransport: proxmox-transport

    pi_hole:
      loadBalancer:
        servers:
          - url: http://192.168.50.155

    dev_machine:
      loadBalancer:
        servers:
          - url: http://192.168.50.158:5173

    service_machine:
      loadBalancer:
        servers:
          - url: http://192.168.50.158:8000

    mail_machine:
      loadBalancer:
        servers:
          - url: http://192.168.50.44:1080

    xiaozhi_web:
      loadBalancer:
        servers:
          - url: http://192.168.50.44:8002

    xiaozhi_ota:
      loadBalancer:
        servers:
          - url: http://192.168.50.44:8002/xiaozhi/ota/

    home_assistant:
      loadBalancer:
        servers:
          - url: http://192.168.50.50:8123

    bus_frontend:
      loadBalancer:
        servers:
          - url: http://192.168.50.158:3001

    bus_api:
      loadBalancer:
        servers:
          - url: http://192.168.50.158:9080

    rag_agent:
      loadBalancer:
        servers:
          - url: http://192.168.50.158:8100

    mysterium:
      loadBalancer:
        servers:
          - url: http://192.168.50.158:8200

  serversTransports:
      proxmox-transport:
        insecureSkipVerify: true
services:
  cinder:
    image: docker.io/furyhawk/cinder:latest
    restart: always
    networks:
      - traefik-public
    deploy:
      labels:
        - "traefik.enable=true"
        - traefik.swarm.network=traefik-public
        - traefik.constraint-label=traefik-public
        - "traefik.http.routers.cinder.entrypoints=https"
        - "traefik.http.routers.cinder.rule=Host(`cinder.${DOMAIN}`)"
        - "traefik.http.routers.cinder.tls.certresolver=le"
        - "traefik.http.routers.cinder.service=cinder"
        - "traefik.http.services.cinder.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
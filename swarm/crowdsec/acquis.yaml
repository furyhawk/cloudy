source: docker
# CrowdSec enumerates Swarm *services* on a manager node, so labels are read from the
# service's `deploy.labels` (see the traefik service in swarm/core.yml), not from task
# containers. `use_service_labels` cannot be combined with `service_name`.
use_service_labels: true
# Services opt in with these labels so CrowdSec can pick them up and classify logs:
# - crowdsec.enable=true
# - crowdsec.labels.type=traefik
labels:
  type: traefik
